# nginx/hrm.conf
# Production Nginx reverse proxy for BBD HRM (hrm.duolinkmm.com)
#
# Installation on GCP VM:
#   sudo cp nginx/hrm.conf /etc/nginx/sites-available/hrm.duolinkmm.com
#   sudo ln -s /etc/nginx/sites-available/hrm.duolinkmm.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d hrm.duolinkmm.com   # First time only
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS Redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hrm.duolinkmm.com;

    # Let's Encrypt ACME challenge path (required for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Main Server Block ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrm.duolinkmm.com;

    # ── TLS (Certbot will manage these paths) ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/hrm.duolinkmm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrm.duolinkmm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Body size — required for photo check-ins and file uploads ────────────
    client_max_body_size 50M;

    # ── Upstream timeouts (important for long AI responses) ──────────────────
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── WebSocket — Socket.IO (CRM realtime) ─────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;

        # WebSocket-specific timeouts
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── API + everything else → Express ──────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Disable buffering for streaming responses (AI boss chat SSE if added)
        proxy_buffering off;
    }
}
