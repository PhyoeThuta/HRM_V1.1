name: Build & Deploy to GCP VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave blank to deploy latest build)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/phyoethuta/hrm_v1.1

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build Docker image and push to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass VITE build-time arg securely from GitHub Secrets
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Layer cache from GHCR for faster builds
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Deploy new image to GCP VM via SSH
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build
    # Only deploy to production from main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code (needed for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Resolve image tag to deploy
        id: resolve_tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          fi

      - name: Copy docker-compose.yml to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USERNAME }}
          key:      ${{ secrets.GCP_SSH_KEY }}
          source:   "docker-compose.yml,nginx/"
          target:   "/opt/bbd"

      - name: Deploy via SSH to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USERNAME }}
          key:      ${{ secrets.GCP_SSH_KEY }}
          envs:     IMAGE_TAG,IMAGE_NAME,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -euo pipefail

            echo "=== Deploying image: ${IMAGE_NAME}:${IMAGE_TAG} ==="

            # Authenticate to GHCR from the VM
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Pull the new image before stopping the old one (pre-pull for faster cutover)
            docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

            # ── PM2 → Docker Cutover ──────────────────────────────────────────
            # Stop PM2 processes if they exist (one-time migration from old setup)
            if command -v pm2 &> /dev/null; then
              echo "=== Stopping PM2 processes to free port 8080 ==="
              pm2 stop hrm_react_api 2>/dev/null || true
              pm2 stop hrm_react_client 2>/dev/null || true
              pm2 delete hrm_react_api 2>/dev/null || true
              pm2 delete hrm_react_client 2>/dev/null || true
              pm2 save 2>/dev/null || true
            fi

            # Safety net: kill anything still holding port 8080
            PIDS=$(lsof -ti tcp:8080 2>/dev/null || true)
            if [ -n "${PIDS}" ]; then
              echo "=== Force-killing leftover process on port 8080 (PID: ${PIDS}) ==="
              echo "${PIDS}" | xargs kill -9 2>/dev/null || true
              sleep 2
            fi
            # ─────────────────────────────────────────────────────────────────

            # Update the IMAGE_TAG for docker compose
            export IMAGE_TAG="${IMAGE_TAG}"

            # Navigate to the compose file location
            cd /opt/bbd

            # Write current IMAGE_TAG to .env so docker compose picks it up
            echo "IMAGE_TAG=${IMAGE_TAG}" > .compose.env

            # Rolling replace: start new container, old one is stopped automatically
            IMAGE_TAG="${IMAGE_TAG}" docker compose up -d --pull never

            # Wait for health check to pass (max 60s)
            echo "=== Waiting for health check ==="
            HEALTHY=false
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' bbd_hrm_app 2>/dev/null || echo "starting")
              echo "Health: ${STATUS} (attempt ${i}/12)"
              if [ "${STATUS}" = "healthy" ]; then
                HEALTHY=true
                echo "=== Container is healthy! ==="
                break
              fi
              sleep 5
            done

            if [ "${HEALTHY}" = "false" ]; then
              echo "=== ERROR: Container failed health check. Rolling back. ==="
              PREVIOUS_IMAGE=$(docker ps -a --filter "name=bbd_hrm_app" --format "{{.Image}}" | tail -n 2 | head -n 1 || true)
              if [ -n "${PREVIOUS_IMAGE}" ]; then
                IMAGE_TAG=$(echo "${PREVIOUS_IMAGE}" | cut -d: -f2) docker compose up -d --pull never
              fi
              exit 1
            fi

            # ── Nginx: sync config + reload ───────────────────────────────────
            # Always reload nginx after a successful container swap so it
            # flushes stale upstream connections and serves the new container.
            # Also syncs nginx/hrm.conf from the repo in case it changed.
            NGINX_CONF_SRC="/opt/bbd/nginx/hrm.conf"
            NGINX_CONF_DST="/etc/nginx/sites-available/hrm.duolinkmm.com"

            if [ -f "${NGINX_CONF_SRC}" ]; then
              echo "=== Syncing nginx config from repo ==="
              sudo cp "${NGINX_CONF_SRC}" "${NGINX_CONF_DST}"
            fi

            if sudo nginx -t 2>&1; then
              echo "=== Nginx config valid — reloading nginx ==="
              sudo systemctl reload nginx
              echo "=== Nginx reloaded — new container is now live ==="
            else
              echo "=== WARNING: nginx -t failed — skipping reload to prevent downtime ==="
              echo "=== The app container is healthy but nginx config has an error. Fix manually. ==="
            fi
            # ─────────────────────────────────────────────────────────────────

            echo "=== Deployment complete! Image: ${IMAGE_NAME}:${IMAGE_TAG} ==="
