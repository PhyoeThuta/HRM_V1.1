name: Deploy to GCP VM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy via SSH to GCP
      uses: appleboy/ssh-action@v1.0.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        PAYMENT_INFO_TEXT: ${{ secrets.PAYMENT_INFO_TEXT }}
        VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        envs: GITHUB_TOKEN,EMAIL_USER,EMAIL_PASS,PAYMENT_INFO_TEXT,VITE_GOOGLE_MAPS_API_KEY
        script: |
          # 1. Navigate to project folder
          cd /var/www/hrm_react
          
          # 2. Pull latest code from GitHub (init if first time)
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://x-access-token:$GITHUB_TOKEN@github.com/PhyoeThuta/HRM_V1.1.git
          else
            git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/PhyoeThuta/HRM_V1.1.git
          fi
          
          git fetch --all
          git reset --hard origin/main
          
          # 3. Build React Frontend
          echo "Building Frontend..."
          cd hrm-client
          
          # Inject Frontend Secrets into .env
          touch .env
          grep -q "^VITE_GOOGLE_MAPS_API_KEY=" .env && sed -i "s|^VITE_GOOGLE_MAPS_API_KEY=.*|VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY|" .env || echo "VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY" >> .env

          npm install
          npm run build
          
          # Start Frontend via PM2 (in case Nginx proxies to it)
          pm2 delete hrm_react_client || true
          pm2 start npm --name "hrm_react_client" -- run preview -- --port 4173
          
          # 4. Setup and Restart Node.js Backend
          echo "Restarting Backend API..."
          cd ../server
          
          # Inject Secrets into .env file
          touch .env
          grep -q "^EMAIL_USER=" .env && sed -i "s/^EMAIL_USER=.*/EMAIL_USER=$EMAIL_USER/" .env || echo "EMAIL_USER=$EMAIL_USER" >> .env
          grep -q "^EMAIL_PASS=" .env && sed -i "s/^EMAIL_PASS=.*/EMAIL_PASS=$EMAIL_PASS/" .env || echo "EMAIL_PASS=$EMAIL_PASS" >> .env
          grep -q "^PAYMENT_INFO_TEXT=" .env && sed -i "s|^PAYMENT_INFO_TEXT=.*|PAYMENT_INFO_TEXT=\"$PAYMENT_INFO_TEXT\"|" .env || echo "PAYMENT_INFO_TEXT=\"$PAYMENT_INFO_TEXT\"" >> .env

          # Install Puppeteer Chromium dependencies (Ubuntu/Debian)
          sudo apt-get update || true
          sudo apt-get install -yq fonts-sil-padauk fonts-noto-core fonts-noto-cjk libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libcairo2 libpango-1.0-0 || true

          npm install --no-audit --no-fund
          
          # Delete only the specific backend process instead of 'all' to prevent killing other services
          pm2 delete hrm_react_api || true
          pm2 start index.js --name "hrm_react_api"
          pm2 save
          # Increase Nginx payload limit to allow large photo check-ins
          sudo sed -i 's/client_max_body_size .*/client_max_body_size 50M;/' /etc/nginx/nginx.conf || true
          if ! grep -q "client_max_body_size 50M;" /etc/nginx/nginx.conf; then
            sudo sed -i '/http {/a \    client_max_body_size 50M;' /etc/nginx/nginx.conf || true
          fi
          sudo systemctl reload nginx || true
          
          echo "Deployment Successful!"
