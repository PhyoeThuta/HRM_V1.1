name: Auto PR & Merge to Main

# Triggers whenever you push to ANY branch except main
on:
  push:
    branches-ignore:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build Docker image to verify the branch is healthy
  # ─────────────────────────────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — just verify)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          cache-from: type=registry,ref=ghcr.io/phyoethuta/hrm_v1.1:buildcache

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Auto-create PR and enable auto-merge (runs after build passes)
  # ─────────────────────────────────────────────────────────────────
  auto-pr-merge:
    name: Auto PR & Merge
    runs-on: ubuntu-latest
    needs: build-check  # Only runs if build-check passes ✅

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create PR if not exists, then auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Check if a PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            echo "Creating new PR for branch: $BRANCH"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Auto: Merge $BRANCH → main" \
              --body "🤖 Auto-created by CI. Docker build passed. Merging automatically."
          else
            echo "PR #$EXISTING_PR already exists for branch: $BRANCH"
          fi

          # Enable auto-merge (squash) — merges as soon as required checks pass
          gh pr merge "$BRANCH" \
            --squash \
            --auto \
            --delete-branch \
            --subject "Auto-merge: $BRANCH → main"

          echo "✅ Auto-merge enabled. Will merge once all checks pass."
