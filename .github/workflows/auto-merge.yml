name: Dev → Create PR to Main

# Step 1 of 2: When dev is pushed, create a PR to main.
# The build check (pr-build-check.yml) will run separately on the PR itself.
# Auto-merge will happen automatically once the build check passes.

on:
  push:
    branches:
      - dev

jobs:
  create-pr:
    name: 📝 Create PR (dev → main)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create PR if not exists and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists from dev → main
          EXISTING_PR=$(gh pr list --head "dev" --base "main" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            echo "=== Creating PR: dev → main ==="
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --title "Release: dev to main" \
              --body "Auto-created by CI. Docker build check will run on this PR. Will auto-merge once all checks pass.")

            echo "=== PR created: ${PR_URL} ==="

            # Enable auto-merge — GitHub will merge once build check passes
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            gh pr merge "${PR_NUMBER}" \
              --squash \
              --auto || \
            echo "Auto-merge will be enabled once checks are running."
          else
            echo "=== PR #${EXISTING_PR} already exists. Skipping creation. ==="
            # Update auto-merge on existing PR in case it was disabled
            gh pr merge "${EXISTING_PR}" \
              --squash \
              --auto \
              --subject "Release: dev → main [auto-merged after build check ✅]" || \
            echo "Auto-merge already enabled or checks still running."
          fi
