name: Dev → Auto PR → Main

# Real-world workflow:
# 1. Developer pushes code to `dev` branch
# 2. Docker build check runs automatically
# 3. If build passes → Auto PR created → Auto-merged into `main`
# 4. deploy.yml triggers on main merge → deploys to production

on:
  push:
    branches:
      - dev

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build Docker image to verify dev branch is healthy
  # Runs on EVERY push to dev — catches broken code before it reaches main
  # ─────────────────────────────────────────────────────────────────
  build-check:
    name: 🔨 Build Check (Docker)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only — no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          cache-from: type=registry,ref=ghcr.io/phyoethuta/hrm_v1.1:buildcache

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Auto-create PR and enable auto-merge into main
  # Only runs AFTER build-check passes ✅
  # ─────────────────────────────────────────────────────────────────
  auto-pr-merge:
    name: 🔀 Auto PR → main
    runs-on: ubuntu-latest
    needs: build-check

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create PR if not exists, then enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists from dev → main
          EXISTING_PR=$(gh pr list --head "dev" --base "main" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            echo "=== Creating PR: dev → main ==="
            gh pr create \
              --base main \
              --head dev \
              --title "🚀 Release: dev → main" \
              --body "🤖 Auto-created by CI pipeline.
              
              **Docker build:** ✅ Passed
              
              This PR was automatically created after the build check succeeded on \`dev\` branch.
              It will be automatically merged into \`main\` to trigger production deployment."
          else
            echo "=== PR #${EXISTING_PR} already exists for dev → main ==="
          fi

          # Enable auto-merge (squash strategy keeps main history clean)
          gh pr merge dev \
            --squash \
            --auto \
            --subject "Release: dev → main [auto-merged after build check]"

          echo "=== ✅ Auto-merge enabled. Will merge once all required checks pass. ==="
