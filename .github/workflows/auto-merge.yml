name: Dev → Auto PR → Main

# Real-world workflow:
# 1. Developer pushes code to `dev` branch
# 2. Docker build check runs automatically
# 3. If build passes → Auto PR created → Auto-merged into `main`

on:
  push:
    branches:
      - dev

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Build Docker image to verify dev branch is healthy
  # ─────────────────────────────────────────────────────────────────
  build-check:
    name: 🔨 Build Check (Docker)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only — no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          cache-from: type=registry,ref=ghcr.io/phyoethuta/hrm_v1.1:buildcache

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Auto-create PR and enable auto-merge into main
  # ─────────────────────────────────────────────────────────────────
  auto-pr-merge:
    name: 🔀 Auto PR → main
    runs-on: ubuntu-latest
    needs: build-check

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create PR if not exists, then enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists from dev → main
          EXISTING_PR=$(gh pr list --head "dev" --base "main" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            echo "=== Creating PR: dev → main ==="
            PR_URL=$(gh pr create \
              --base main \
              --head dev \
              --title "Release: dev to main" \
              --body "Auto-created by CI. Docker build passed. Merging automatically.")

            echo "=== PR created: ${PR_URL} ==="

            # IMPORTANT: Wait for GitHub to calculate mergeability before enabling auto-merge
            # Otherwise we get "Pull request is in unstable status" error
            echo "Waiting 15 seconds for GitHub to process the PR..."
            sleep 15

            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            gh pr merge "${PR_NUMBER}" \
              --squash \
              --auto || echo "Auto-merge could not be enabled automatically."
          else
            echo "=== PR #${EXISTING_PR} already exists. ==="
            
            # Wait a bit just in case it was just created
            sleep 5
            
            # Update auto-merge on existing PR in case it was disabled
            gh pr merge "${EXISTING_PR}" \
              --squash \
              --auto || echo "Auto-merge already enabled or checks still running."
          fi
